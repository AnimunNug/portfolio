<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animun4ik | Main Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
	<link rel="icon" href="\favicon.ico" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            var(--dirt-bg): url('ui/dirt_bg.png');
        }

        /* Полное отключение фильтрации пикселей для всех элементов */
        *, *::before, *::after, img, canvas, .mc-btn-img, .mc-btn-img-mini, .world-image, .world-frame, .pixel-frame, .about-btn-slot, .project-thumb-image, .project-thumb-frame, .project-main-image-frame, .project-info-frame {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'VT323', monospace;
            image-rendering: pixelated !important;
            image-rendering: -moz-crisp-edges !important;
            image-rendering: crisp-edges !important;
        }

        body {
            overflow: hidden;
            background-color: #000;
            cursor: url('ui/cursor.png'), auto;
        }

        button {
            background-color: transparent;
            border: none;
            outline: none;
        }

        #skybox-container {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('ui/vignette.png');
            background-size: 100% 100%;
            z-index: 2;
            pointer-events: none;
        }

        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.25s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ---------------- ЛОГОТИП И СПЛЭШ ---------------- */
        .logo-container {
            position: relative;
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: slowLogoEntrance 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards, float 4s ease-in-out 2.5s infinite;
        }

        .logo-image { width: 700px; max-width: 90vw; height: auto; }
        .logo-subtitle-img {
            height: 48px; width: auto; margin-top: -40px; z-index: 2; opacity: 0;         
            animation: fadeInSubtitle 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards; 
        }

        @keyframes fadeInSubtitle {
            0% { opacity: 0; transform: translateY(12px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes slowLogoEntrance {
            0% { opacity: 0; transform: translateY(-80px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulseSplash {
            from { transform: rotate(-15deg) scale(1); }
            to { transform: rotate(-15deg) scale(1.1); }
        }

        .splash-text {
            position: absolute; top: 70%; right: -20px;
            color: #FFFF00; font-size: 2.8rem; text-shadow: 4px 4px 0px #3F3F00;
            transform: rotate(-15deg);
            animation: pulseSplash 0.5s alternate infinite ease-in-out;
            white-space: nowrap; pointer-events: none;
        }

        /* ---------------- КНОПКИ ---------------- */
        .mc-btn-img {
            width: 100%; height: 72px;
            background-color: transparent; background-size: 100% 100%; background-repeat: no-repeat;
            color: #e0e0e0; font-size: 2.4rem; text-shadow: 3px 3px 0px #202020;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.05s, filter 0.1s;
        }
        .mc-btn-img-mini {
            width: 396px; height: 64px;
            background-color: transparent; background-size: 100% 100%; background-repeat: no-repeat;
            color: #e0e0e0; font-size: 2.4rem; text-shadow: 3px 3px 0px #202020;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.05s, filter 0.1s;
        }

        .mc-btn-img:hover, .mc-btn-img-mini:hover { color: #ffffff; text-shadow: 3px 3px 0px #102060; }

        #btn-1 { background-image: url('ui/button_1_normal.png'); }
        #btn-1:hover { background-image: url('ui/button_1_hover.png'); }
        #btn-1:active { background-image: url('ui/button_1_active.png'); }

        #btn-2 { background-image: url('ui/button_2_normal.png'); }
        #btn-2:hover { background-image: url('ui/button_2_hover.png'); }
        #btn-2:active { background-image: url('ui/button_2_active.png'); }

        #btn-3 { background-image: url('ui/button_3_normal.png'); }
        #btn-3:hover { background-image: url('ui/button_3_hover.png'); }
        #btn-3:active { background-image: url('ui/button_3_active.png'); }

        #btn-4 { background-image: url('ui/button_4_normal.png'); }
        #btn-4:hover { background-image: url('ui/button_4_hover.png'); }
        #btn-4:active { background-image: url('ui/button_4_active.png'); }

        #btn-5 { background-image: url('ui/button_5_normal.png'); }
        #btn-5:hover { background-image: url('ui/button_5_hover.png'); }
        #btn-5:active { background-image: url('ui/button_5_active.png'); }
        #btn-5.broke { background-image: url('ui/button_5_broke.png'); cursor: default; }
        #btn-5.broke:hover { background-image: url('ui/button_5_broke.png'); }
        #btn-5.broke:active { background-image: url('ui/button_5_broke.png'); }

        #btn-6 { background-image: url('ui/button_6_normal.png'); }
        #btn-6:hover { background-image: url('ui/button_6_hover.png'); }
        #btn-6:active { background-image: url('ui/button_6_active.png'); }
        #btn-6.broke { background-image: url('ui/button_6_broke.png'); cursor: default; }
        #btn-6.broke:hover { background-image: url('ui/button_6_broke.png'); }
        #btn-6.broke:active { background-image: url('ui/button_6_broke.png'); }

        #btn-9 { background-image: url('ui/button_9_normal.png'); }
        #btn-9:hover { background-image: url('ui/button_9_hover.png'); }
        #btn-9:active { background-image: url('ui/button_9_active.png'); }

        .btn-row-centered {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #mute-btn {
            position: absolute; right: calc(100% + 12px); top: 0;
            width: 72px; height: 72px; flex-shrink: 0;
            background-image: url('ui/sound_on_normal.png');
            background-size: 100% 100%; background-repeat: no-repeat;
            cursor: pointer; transition: transform 0.05s, filter 0.1s;
        }
        #mute-btn:hover { background-image: url('ui/sound_on_hover.png'); }
        #mute-btn:active { background-image: url('ui/sound_on_active.png'); }

        #mute-btn.muted { background-image: url('ui/sound_off_normal.png'); }
        #mute-btn.muted:hover { background-image: url('ui/sound_off_hover.png'); }
        #mute-btn.muted:active { background-image: url('ui/sound_off_active.png'); }

        .button-group {
            display: flex; flex-direction: column; gap: 16px;
            width: 560px; max-width: 90vw; opacity: 0;
            animation: fadeInButtons 1s cubic-bezier(0.25, 1, 0.5, 1) 0.2s forwards;
        }

        .btn-row { display: flex; gap: 12px; width: 100%; }
        .btn-row .mc-btn-img { flex: 1; }

        @keyframes fadeInButtons {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0px); }
        }

        .bottom-info-bar {
            position: absolute; bottom: 14px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            color: #ffffff; font-size: 1.4rem; text-shadow: 2px 2px 0px #000;
            z-index: 10; pointer-events: none;
        }
        
        .world-select-title-img { height: 40px; width: auto; }

        /* ---------------- GUI ВЫБОРА МИРА ---------------- */
        #world-select-gui {
            background-image: url('ui/shadow_ui.png'), url('ui/shadow_ui.png'), url('ui/dirt_bg.png'); 
            background-size: 100% 619px, 100% 100%, 78px 78px;
            background-repeat: no-repeat, no-repeat, repeat;    
            background-position: center 110px, center, top left;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }

        .world-header { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 30px 0 0 0; z-index: 5; }
        .carousel-container { width: 100%; flex-grow: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .carousel-track { position: relative; width: 100%; height: 100%; }

        .carousel-card {
            position: absolute; left: 50%; top: 50%; width: 500px; height: 420px;
            cursor: pointer; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), filter 0.4s, opacity 0.4s;
            transform-origin: center center; user-select: none;
        }

        .world-image { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        .world-frame { position: absolute; top: -62px; left: -62px; width: calc(100% + 124px); height: calc(100% + 124px); background-size: 100% 100%; background-repeat: no-repeat; z-index: 2; pointer-events: none; }
        .world-footer { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 20px; padding-bottom: 40px; width: 100%; z-index: 5; }

        .nav-arrow { width: 78px; height: 78px; background-size: 100% 100%; background-repeat: no-repeat; cursor: pointer; border: none; transition: none; }
        .left-arrow { background-image: url('ui/arrow_left_normal.png'); }
        .left-arrow:hover { background-image: url('ui/arrow_left_hover.png'); }
        .left-arrow:active { background-image: url('ui/arrow_left_active.png'); }
        .left-arrow.deactive { background-image: url('ui/arrow_left_deactive.png'); cursor: default; }

        .right-arrow { background-image: url('ui/arrow_right_normal.png'); }
        .right-arrow:hover { background-image: url('ui/arrow_right_hover.png'); }
        .right-arrow:active { background-image: url('ui/arrow_right_active.png'); }
        .right-arrow.deactive { background-image: url('ui/arrow_right_deactive.png'); cursor: default; }

        .footer-btn-grid { width: 780px; max-width: 64vw; display: flex; flex-direction: column; gap: 10px; }

        .custom-corner-popup {
            position: absolute; bottom: 20px; left: 20px; width: 400px; height: 400px;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 1s ease-in-out; 
        }
        .custom-corner-popup.show { opacity: 1; transition: none; }
        .shake-anim { animation: popupShake 0.1s cubic-bezier(.36,.07,.19,.97) both; }

        @keyframes popupShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-2px, 0, 0); }
            40%, 60% { transform: translate3d(2px, 0, 0); }
        }
        
        /* ---------------- ОБЩИЙ СТИЛЬ СУНДУКОВ ---------------- */
        #blocks-gui, #sprites-gui, #projects-list-gui, #project-detail-gui { background: rgba(0,0,0,0.75); }
        .chest-window {
            background-image: url('ui/chest_gui_bg.png'); background-size: 100% 100%;
            width: 980px; max-width: 92vw; height: 76vh;
            display: flex; flex-direction: column; padding: 24px; position: relative;
        }

        /* Расширенное окно списка моделей и концептов (вмещает 3 превью без уменьшения) */
        #projects-list-gui .chest-window {
            width: 1240px;
            max-width: 96vw;
            height: 100vh;
            padding: 0; /* Убираем стандартные отступы сундука, чтобы шапка прилегала идеально */
        }

        /* Увеличенная ширина и высота окна детального просмотра проекта */
        #project-detail-gui .chest-window {
            width: 1440px;
            max-width: 98vw;
            height: 88vh;
            padding: 24px;
        }

        .chest-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .chest-title { font-size: 2.3rem; color: #373737; display: flex; align-items: center; }
        .chest-title-img { height: 36px; width: auto; object-fit: contain; display: block; }
        .chest-title-text { color: #373737; }
        
        .pixel-close-btn {
            width: 36px; height: 36px; background-image: url('ui/close_btn_normal.png');
            background-size: 100% 100%; cursor: pointer; flex-shrink: 0;
        }
        .pixel-close-btn:hover { background-image: url('ui/close_btn_hover.png'); }
        .pixel-close-btn:active { background-image: url('ui/close_btn_active.png'); }

        ::-webkit-scrollbar { width: 16px; }
        ::-webkit-scrollbar-track { background-image: url('ui/scrollbar_track.png'); background-size: 100% 100%; }
        ::-webkit-scrollbar-thumb { background-image: url('ui/scrollbar_thumb.png'); background-size: 100% 100%; }
        ::-webkit-scrollbar-corner { background: transparent; }

        /* ---------------- СТАТИСТИКА И СЕТКА БЛОКОВ (16x16) ---------------- */
        .blocks-grid-container {
            background-image: url('ui/inventory_grid_bg.png'); background-size: 100% 100%;
            flex-grow: 1; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 0; overflow-y: auto; align-content: start;
        }

        .block-item-slot {
            width: 100%; aspect-ratio: 1 / 1; background-image: url('ui/item_slot_bg.png');
            background-size: 100% 100%; display: flex; align-items: center; justify-content: center;
            padding: 4px; margin: 0; cursor: pointer; position: relative; z-index: 1; transition: transform 0.1s ease, z-index 0.1s ease;
        }
        .block-item-slot:hover { transform: scale(1.2); z-index: 10; }
        .block-item-slot img {
            width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated !important;
            animation: blockPopIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
        }

        @keyframes blockPopIn {
            0% { opacity: 0; transform: scale(0.1); }
            70% { opacity: 1; transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* ---------------- СЕТКА ПРОЕКТОВ (МОДЕЛИ, АРТЫ) ---------------- */
        .projects-grid {
            background-image: url('ui/inventory_grid_bg.png'); background-size: 100% 100%;
            flex-grow: 1; padding: 24px; display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 24px; overflow-y: auto; align-content: start;
            scroll-behavior: smooth;
        }

        /* Специфичный стиль шапки проекта с текстурой шириной 1px, растянутой на всю ширину экрана */
        .project-head-line {
            position: absolute;
            top: 0;
            left: -400px;
            width: 150vw;
            height: 60px; /* Высота шапки */
            z-index: 2; /* Располагается под текстом заголовка и кнопкой */
            pointer-events: none;
        }

        /* Специфичный хэдер для проектов с нулевым отступом и поверх шапки */
        .projects-custom-header {
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            width: 100%;
        }

        .project-card {
            background-image: url('ui/item_slot_bg.png'); background-size: 100% 100%;
            padding: 16px; text-align: center; cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; 
            animation: blockPopIn 0.4s backwards;
            transform: scale(var(--scroll-scale, 1));
            opacity: var(--scroll-scale, 1);
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.15s ease;
            will-change: transform, opacity;
        }
        .project-card:hover { 
            transform: scale(calc(var(--scroll-scale, 1) * 1.05)); 
            z-index: 5; 
        }
        
        .project-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            margin: 8px 0;
        }
        .project-thumb-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .project-thumb-frame {
            position: absolute;
            top: -22px;
            left: -22px;
            width: calc(100% + 44px);
            height: calc(100% + 44px);
            background-size: 100% 100%;
            background-repeat: no-repeat;
            z-index: 2;
            pointer-events: none;
        }

        .project-card h4 { font-size: 1.8rem; color: #373737; margin-top: 12px; line-height: 1.1; }

        /* ---------------- ПРОСМОТР ПРОЕКТА (ОБНОВЛЕННЫЙ СТИЛЬ С КАРТИНКАМИ-РАМКАМИ) ---------------- */
        .project-detail-layout {
            display: flex; flex-direction: row; flex-grow: 1; gap: 24px; overflow: hidden; height: calc(100% - 50px);
        }
        
        .project-gallery-section {
            flex: 3.2; display: flex; flex-direction: column; 
            background-image: url('ui/inventory_grid_bg.png'); background-size: 100% 100%;
            padding: 16px; position: relative;
        }
        
        .project-main-image-wrapper {
            flex-grow: 1; display: flex; justify-content: center; align-items: center;
            position: relative; overflow: hidden; width: 100%; height: 100%;
            background-image: url('ui/item_slot_bg.png'); background-size: 100% 100%;
            padding: 12px;
        }

        .project-main-image-frame {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('ui/project_detail_frame.png'); background-size: 100% 100%;
            pointer-events: none; z-index: 3;
        }
        
        .project-main-image {
            max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain;
            transition: opacity 0.2s; z-index: 1;
        }

        /* Отдельные изображения для стрелок в просмотрщике проекта */
        #project-detail-gui .carousel-nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 54px; height: 54px; background-size: 100% 100%; background-repeat: no-repeat;
            cursor: pointer; z-index: 10;
        }
        #project-detail-gui .carousel-prev { 
            left: 14px; background-image: url('ui/project_arrow_left_normal.png'); 
        }
        #project-detail-gui .carousel-prev:hover { 
            background-image: url('ui/project_arrow_left_hover.png'); 
        }
        #project-detail-gui .carousel-prev:active { 
            background-image: url('ui/project_arrow_left_active.png'); 
        }
        #project-detail-gui .carousel-next { 
            right: 14px; background-image: url('ui/project_arrow_right_normal.png'); 
        }
        #project-detail-gui .carousel-next:hover { 
            background-image: url('ui/project_arrow_right_hover.png'); 
        }
        #project-detail-gui .carousel-next:active { 
            background-image: url('ui/project_arrow_right_active.png'); 
        }

        .project-thumbnails-strip {
            display: flex; gap: 10px; margin-top: 12px; overflow-x: auto;
            padding-bottom: 5px; height: 86px; flex-shrink: 0; justify-content: center;
            z-index: 5;
        }
        .project-thumb-slot {
            width: 76px; height: 76px; background-image: url('ui/item_slot_bg.png'); 
            background-size: 100% 100%; padding: 4px; cursor: pointer; transition: 0.1s;
            opacity: 0.6; flex-shrink: 0;
        }
        .project-thumb-slot:hover { opacity: 1; }
        .project-thumb-slot.active { opacity: 1; transform: scale(1.05); filter: brightness(1.2); outline: 2px solid #fff; }
        .project-thumb-slot img { width: 100%; height: 100%; object-fit: cover; }

        .project-info-section {
            flex: 1; min-width: 300px; display: flex; flex-direction: column;
            background-image: url('ui/inventory_grid_bg.png'); background-size: 100% 100%;
            padding: 20px; position: relative;
        }

        .project-info-frame {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('ui/project_info_frame.png'); background-size: 100% 100%;
            pointer-events: none; z-index: 3;
        }

        .project-info-title {
            font-size: 2.2rem; color: #222; text-shadow: 1px 1px 0px #eee;
            margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px dashed #777;
            z-index: 1;
        }
        .project-info-desc {
            font-size: 1.4rem; color: #111; overflow-y: auto; flex-grow: 1; 
            white-space: pre-wrap; line-height: 1.2; padding-right: 5px;
            z-index: 1;
        }

        /* ---------------- GUI ABOUT ME & CONTACTS ---------------- */
        #about-gui, #contact-gui { background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .about-container { position: relative; display: flex; align-items: center; justify-content: center; width: 800px; max-width: 90vw; }
        .contact-container { position: relative; display: flex; align-items: center; justify-content: center; width: 500px; max-width: 85vw; }

        .custom-display-image {
            width: 100%; height: auto; display: block; filter: drop-shadow(0px 8px 20px rgba(0,0,0,0.8));
            opacity: 0; transform: scale(0.92) translateY(15px);
        }

        #about-gui:not(.hidden) .custom-display-image,
        #contact-gui:not(.hidden) .custom-display-image {
            animation: imagePopIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        @keyframes imagePopIn {
            0% { opacity: 0; transform: scale(0.92) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .about-buttons-row, .contact-buttons-row {
            position: absolute; bottom: 7%; left: 3.2%; width: 93.6%; height: 16.5%;
            display: grid; grid-template-columns: repeat(8, 1fr); gap: 1%; align-items: center; justify-items: center; z-index: 10;
        }

        .about-btn-slot {
            width: 100%; height: 100%; background-color: transparent; background-size: contain; background-position: center;
            background-repeat: no-repeat; border: none; outline: none; cursor: pointer; opacity: 0; transition: transform 0.1s, filter 0.1s;
        }
        .about-btn-slot:hover { filter: brightness(1.25); transform: scale(1.08); }
        .about-btn-slot:active { filter: brightness(0.85); transform: scale(0.95); }

        #about-slot-1 { background-image: url('ui/about_btn_1.png'); }
        #about-slot-2 { background-image: url('ui/about_btn_2.png'); }
        #about-slot-3 { background-image: url('ui/about_btn_3.png'); }
        #about-slot-4 { background-image: url('ui/about_btn_4.png'); }
        #about-slot-5 { background-image: url('ui/about_btn_5.png'); }
        #about-slot-6 { background-image: url('ui/about_btn_6.png'); grid-column: 8; }
        #contact-slot-6 { background-image: url('ui/contact_close_btn.png'); grid-column: 8; }

        #about-gui:not(.hidden) .about-btn-slot { animation: btnPopIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        #about-gui:not(.hidden) .about-btn-slot:nth-child(1) { animation-delay: 0.15s; }
        #about-gui:not(.hidden) .about-btn-slot:nth-child(2) { animation-delay: 0.22s; }
        #about-gui:not(.hidden) .about-btn-slot:nth-child(3) { animation-delay: 0.29s; }
        #about-gui:not(.hidden) .about-btn-slot:nth-child(4) { animation-delay: 0.36s; }
        #about-gui:not(.hidden) .about-btn-slot:nth-child(5) { animation-delay: 0.43s; }
        #about-gui:not(.hidden) .about-btn-slot:nth-child(6) { animation-delay: 0.50s; }
        #contact-gui:not(.hidden) .about-btn-slot { animation: btnPopIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }

        @keyframes btnPopIn {
            0% { opacity: 0; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1); }
        }

        .contact-copy-trigger { position: absolute; top: 53%; left: 6.5%; width: 87%; height: 18%; cursor: pointer; z-index: 15; }
        .contact-copy-pop {
            position: absolute; top: 76%; left: 50%; width: 156px; height: 24px;
            transform: translateX(-50%); z-index: 20; opacity: 0; pointer-events: none; transition: opacity 1s ease-out;
        }
        .contact-copy-pop.show { opacity: 1; transition: opacity 0.1s ease-in; }
        .contact-copy-pop.fade-out { opacity: 0; transition: opacity 1s ease-out; }

        .about-tooltip { position: fixed; pointer-events: none; z-index: 1000; display: none; filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.6)); }
        .about-tooltip img { display: block; max-width: 280px; height: auto; }
    </style>
</head>
<body>

    <div id="skybox-container"></div>
    <div class="vignette"></div>

    <div id="about-tooltip" class="about-tooltip">
        <img id="about-tooltip-img" src="" alt="Item Description">
    </div>

    <div class="ui-layer" id="main-menu">
        <div class="logo-container">
            <img src="ui/logo.png" alt="Animun4ik Logo" class="logo-image">
            <img src="ui/logo_subtitle.png" alt="MC ARTIST" class="logo-subtitle-img">
            <div class="splash-text" id="splash"></div>
        </div>

        <div class="button-group">
            <button id="btn-1" class="mc-btn-img" onclick="playUiSound('click'); openWorldSelect();"></button>
            <button id="btn-2" class="mc-btn-img" onclick="playUiSound('click'); openAboutGUI();"></button>
            
            <div class="btn-row-centered">
                <button id="mute-btn" title="Звук включен" onclick="toggleMute();"></button>
                <button id="btn-3" class="mc-btn-img" onclick="playUiSound('click'); openContactGUI();"></button>
            </div>
        </div>

        <div class="bottom-info-bar">
            <span>Animun4ik v1.0 (Minecraft 1.20.4)</span>
            <span>Copyright Animun4ik. Do not distribute!</span>
        </div>
    </div>

    <!-- ОКНО ABOUT ME -->
    <div class="ui-layer hidden" id="about-gui">
        <div class="about-container">
            <img src="ui/about_image.png" alt="About GUI" class="custom-display-image" id="custom-image-slot">
            
            <div class="about-buttons-row">
                <button class="about-btn-slot" id="about-slot-1" onclick="playUiSound('click');"></button>
                <button class="about-btn-slot" id="about-slot-2" onclick="playUiSound('click');"></button>
                <button class="about-btn-slot" id="about-slot-3" onclick="playUiSound('click');"></button>
                <button class="about-btn-slot" id="about-slot-4" onclick="playUiSound('click');"></button>
                <button class="about-btn-slot" id="about-slot-5" onclick="playUiSound('click');"></button>
                <button class="about-btn-slot" id="about-slot-6" onclick="playUiSound('click'); closeToMainMenu();"></button>
            </div>
        </div>
    </div>

    <!-- ОКНО CONTACTS -->
    <div class="ui-layer hidden" id="contact-gui">
        <div class="contact-container">
            <img src="ui/contact_image.png" alt="Contact GUI" class="custom-display-image">
            <div class="contact-copy-trigger" onclick="copyContactTag();"></div>
            <img id="contact-copy-pop" src="ui/copied.png" class="contact-copy-pop">

            <div class="contact-buttons-row">
                <button class="about-btn-slot" id="contact-slot-6" onclick="playUiSound('click'); closeToMainMenu();"></button>
            </div>
        </div>
    </div>

    <!-- ОКНО ВЫБОРА МИРА -->
    <div class="ui-layer hidden" id="world-select-gui">
        <div id="custom-corner-popup" class="custom-corner-popup"></div>

        <div class="world-header">
            <img src="ui/Category_text.png" class="world-select-title-img">
        </div>
        
        <div class="carousel-container">
            <div class="carousel-track" id="carousel-track"></div>
        </div>

        <div class="world-footer">
            <button class="nav-arrow left-arrow" onclick="prevCarouselItem();"></button>

            <div class="footer-btn-grid">
                <div class="btn-row">
                    <button id="btn-4" class="mc-btn-img-mini" onclick="playUiSound('click'); playSelectedWorld();"></button>
                    <button id="btn-5" class="mc-btn-img-mini" onclick="clickBtn5()"></button>
                </div>
                <div class="btn-row">
                    <button id="btn-6" class="mc-btn-img-mini" onclick="clickBtn6()"></button>
                    <button id="btn-9" class="mc-btn-img-mini" onclick="playUiSound('click'); closeToMainMenu();"></button>
                </div>
            </div>

            <button class="nav-arrow right-arrow" onclick="nextCarouselItem();"></button>
        </div>
    </div>

    <!-- ОКНО: BLOCKS (ИЗ JSON) -->
    <div class="ui-layer hidden" id="blocks-gui">
        <div class="chest-window">
            <div class="chest-header">
                <div class="chest-title"><img src="ui/blocks_title.png" alt="Blocks" class="chest-title-img" onerror="this.style.display='none'; this.parentNode.innerHTML='Blocks';"></div>
                <button class="pixel-close-btn" onclick="playUiSound('click'); closeToWorldSelect();"></button>
            </div>
            <div class="blocks-grid-container" id="blocks-grid"></div>
        </div>
    </div>

    <!-- ОКНО: SPRITES (ИЗ JSON) -->
    <div class="ui-layer hidden" id="sprites-gui">
        <div class="chest-window">
            <div class="chest-header">
                <div class="chest-title"><img src="ui/sprites_title.png" alt="Sprites" class="chest-title-img" onerror="this.style.display='none'; this.parentNode.innerHTML='Sprites';"></div>
                <button class="pixel-close-btn" onclick="playUiSound('click'); closeToWorldSelect();"></button>
            </div>
            <div class="blocks-grid-container" id="sprites-grid"></div>
        </div>
    </div>

    <!-- ОКНО: СЕТКА ПРОЕКТОВ (МОДЕЛИ / КОНЦЕПТЫ ИЗ JSON) -->
    <div class="ui-layer hidden" id="projects-list-gui">
        <div class="chest-window">
            <!-- Растянутая шапка на всю ширину экрана с нулевым отступом -->
            <img src="ui/project_head.png" class="project-head-line">
            
            <div class="projects-custom-header">
                <div class="chest-title">
					<img id="projects-list-title" src="" alt="Projects" class="chest-title-img" onerror="this.style.display='none'; document.getElementById('projects-list-text').style.display='block';">
					<span id="projects-list-text" style="display:none; color: #373737; font-size: 2.3rem;">Projects</span>
				</div>
                <button class="pixel-close-btn" onclick="playUiSound('click'); closeToWorldSelect();"></button>
            </div>
            <div class="projects-grid" id="projects-grid"></div>
        </div>
    </div>

    <!-- ОКНО: ДЕТАЛЬНЫЙ ПРОСМОТР ПРОЕКТА (ОБНОВЛЕННЫЕ РАМКИ И СТРЕЛКИ) -->
    <div class="ui-layer hidden" id="project-detail-gui">
        <div class="chest-window">
            <div class="chest-header">
                <div class="chest-title chest-title-text" id="project-detail-header-title">Проект</div>
                <button class="pixel-close-btn" onclick="playUiSound('click'); closeProjectDetail();"></button>
            </div>
            
            <div class="project-detail-layout">
                <!-- Левая часть: Карусель с рамочным оверлеем -->
                <div class="project-gallery-section">
                    <div class="project-main-image-wrapper">
                        <div class="carousel-nav-btn carousel-prev" onclick="changeProjectImage(-1)"></div>
                        <img id="project-main-image" class="project-main-image" src="" alt="Project Image">
                        <div class="carousel-nav-btn carousel-next" onclick="changeProjectImage(1)"></div>
                        <div class="project-main-image-frame"></div>
                    </div>
                    <div class="project-thumbnails-strip" id="project-thumbnails-strip">
                        <!-- Миниатюры инжектятся сюда -->
                    </div>
                </div>

                <!-- Правая часть: Описание с рамочным оверлеем -->
                <div class="project-info-section">
                    <div class="project-info-title" id="project-info-title">Название проекта</div>
                    <div class="project-info-desc" id="project-info-desc">Описание проекта...</div>
                    <div class="project-info-frame"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ---------------- УПРАВЛЕНИЕ ЗВУКАМИ ИНТЕРФЕЙСА ---------------- */
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function toggleMute() {
            soundEnabled = !soundEnabled;
            const muteBtn = document.getElementById('mute-btn');

            if (soundEnabled) {
                muteBtn.classList.remove('muted');
                muteBtn.title = 'Звук включен';
                playUiSound('click');
            } else {
                muteBtn.classList.add('muted');
                muteBtn.title = 'Звук выключен';
            }
        }

        function playUiSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); 
            gain.connect(audioCtx.destination);

            if (type === 'hover') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.03);
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.03);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.03);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(550, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.06);
            }
        }

        document.addEventListener('mouseover', (e) => {
            if (e.target.id === 'mute-btn') {
                playUiSound('hover');
                return;
            }
            if (((e.target.classList.contains('mc-btn-img') || e.target.classList.contains('mc-btn-img-mini') || e.target.classList.contains('pixel-close-btn') || e.target.classList.contains('about-btn-slot') || e.target.classList.contains('contact-copy-trigger') || e.target.classList.contains('carousel-nav-btn')) && !e.target.classList.contains('broke')) || 
                (e.target.classList.contains('nav-arrow') && !e.target.classList.contains('deactive'))) {
                playUiSound('hover');
            }
        });

        /* ---------------- ЛОГИКА НАВИГАЦИИ ПО ESC ---------------- */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const worldSelect = document.getElementById('world-select-gui');
                const aboutGui = document.getElementById('about-gui');
                const contactGui = document.getElementById('contact-gui');
                const blocksGui = document.getElementById('blocks-gui');
                const spritesGui = document.getElementById('sprites-gui');
                const projectsListGui = document.getElementById('projects-list-gui');
                const projectDetailGui = document.getElementById('project-detail-gui');

                if (!projectDetailGui.classList.contains('hidden')) {
                    playUiSound('click');
                    closeProjectDetail();
                    return;
                }

                if (!blocksGui.classList.contains('hidden') || !spritesGui.classList.contains('hidden') || !projectsListGui.classList.contains('hidden')) {
                    playUiSound('click');
                    closeToWorldSelect();
                    return;
                }

                if (!worldSelect.classList.contains('hidden') || !aboutGui.classList.contains('hidden') || !contactGui.classList.contains('hidden')) {
                    playUiSound('click');
                    closeToMainMenu();
                }
            }
        });

        function closeToMainMenu() {
            document.getElementById('blocks-gui').classList.add('hidden');
            document.getElementById('sprites-gui').classList.add('hidden');
            document.getElementById('projects-list-gui').classList.add('hidden');
            document.getElementById('project-detail-gui').classList.add('hidden');
            document.getElementById('world-select-gui').classList.add('hidden');
            document.getElementById('about-gui').classList.add('hidden');
            document.getElementById('contact-gui').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            document.removeEventListener('keydown', carouselKeyHandler);
            hideTooltip();
        }

        function closeToWorldSelect() {
            document.getElementById('blocks-gui').classList.add('hidden');
            document.getElementById('sprites-gui').classList.add('hidden');
            document.getElementById('projects-list-gui').classList.add('hidden');
            document.getElementById('project-detail-gui').classList.add('hidden');
            openWorldSelect();
        }

        /* ---------------- КОПИРОВАНИЕ ДИСКОРД ТЕГА ---------------- */
        let copyPopupTimeout;
        function copyContactTag() {
            navigator.clipboard.writeText('animun_second').catch(err => console.error('Не удалось скопировать:', err));
            playUiSound('click');
            const popup = document.getElementById('contact-copy-pop');
            if (!popup) return;
            clearTimeout(copyPopupTimeout);
            popup.classList.remove('fade-out');
            popup.classList.add('show');
            copyPopupTimeout = setTimeout(() => {
                popup.classList.remove('show');
                popup.classList.add('fade-out');
            }, 1000);
        }

        /* ---------------- ПАСХАЛКА ---------------- */
        let btn5Clicks = 0; let btn6Clicks = 0; let buttonSequence = ""; let popupTimeout; 
        const imageAliases = { '666': '555', '5565': '555', '665': '556', '55656': '55566' };

        function clickBtn5() {
            const btn = document.getElementById('btn-5');
            if (btn.classList.contains('broke')) return;
            playUiSound('click'); btn5Clicks++; triggerCornerPopup('5');
            if (btn5Clicks >= 3) { btn.classList.add('broke'); }
        }

        function clickBtn6() {
            const btn = document.getElementById('btn-6');
            if (btn.classList.contains('broke')) return;
            playUiSound('click'); btn6Clicks++; triggerCornerPopup('6');
            if (btn6Clicks >= 3) { btn.classList.add('broke'); }
        }

        function triggerCornerPopup(btnNum) {
            const popup = document.getElementById('custom-corner-popup');
            buttonSequence += btnNum; 
            clearTimeout(popupTimeout);
            popup.classList.remove('show', 'shake-anim');
            let targetImage = buttonSequence;
            if (buttonSequence.length === 6) { targetImage = '555666'; } 
            else if (imageAliases[buttonSequence]) { targetImage = imageAliases[buttonSequence]; }
            popup.style.backgroundImage = `url('ui/buttonstory/${targetImage}.png')`;
            void popup.offsetWidth;
            popup.classList.add('show', 'shake-anim');
            popupTimeout = setTimeout(() => { popup.classList.remove('show'); }, 2000);
        }

        /* ---------------- ДАННЫЕ МИРОВ И КАРУСЕЛЬ ---------------- */
        const projectWorlds = [
            { id: "blocks", name: "Blocks Textures", img: "ui/world_blocks.png", frame: "ui/frame_blocks.png" },
            { id: "sprites", name: "Sprites", img: "ui/world_sprites.png", frame: "ui/frame_sprites.png" },
            { id: "models", name: "Models", img: "ui/world_models.png", frame: "ui/frame_models.png" },
            { id: "concepts", name: "Concept Art", img: "ui/world_concept.png", frame: "ui/frame_concepts.png" },
            { id: "animations", name: "Animations", img: "ui/world_animations.png", frame: "ui/frame_animations.png" }
        ];

        const splashes = ["100% Custom!", "Better than Vanilla!", "Blockbench Master!", "Pixels Perfect!"];
        document.getElementById('splash').innerText = splashes[Math.floor(Math.random() * splashes.length)];
        
        let selectedWorldIndex = 2;
        let currentCarouselIndex = 2;

        function openWorldSelect() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('world-select-gui').classList.remove('hidden');
            renderWorldsCarousel();
            document.addEventListener('keydown', carouselKeyHandler);
        }

        function openAboutGUI() {
            const btn5Broke = document.getElementById('btn-5').classList.contains('broke');
            const btn6Broke = document.getElementById('btn-6').classList.contains('broke');
            const customImage = document.getElementById('custom-image-slot');
            if (btn5Broke && btn6Broke) { customImage.src = 'ui/about_image_broke.png'; } else { customImage.src = 'ui/about_image.png'; }
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('about-gui').classList.remove('hidden');
        }

        function openContactGUI() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('contact-gui').classList.remove('hidden');
        }

        function carouselKeyHandler(e) {
            if (document.getElementById('world-select-gui').classList.contains('hidden')) return;
            if (e.key === 'ArrowRight') { nextCarouselItem(); }
            else if (e.key === 'ArrowLeft') { prevCarouselItem(); }
            else if (e.key === 'Enter') { playUiSound('click'); playSelectedWorld(); }
        }

        function renderWorldsCarousel() {
            const track = document.getElementById('carousel-track');
            track.innerHTML = '';
            projectWorlds.forEach((world, index) => {
                track.innerHTML += `
                    <div class="carousel-card" onclick="selectCarouselItem(${index})" ondblclick="playUiSound('click'); playSelectedWorld();">
                        <img src="${world.img}" alt="${world.name}" class="world-image">
                        <div class="world-frame" style="background-image: url('${world.frame}');"></div>
                    </div>
                `;
            });
            updateCarousel();
        }

        function updateCarousel() {
            const cards = document.querySelectorAll('.carousel-card');
            cards.forEach((card, index) => {
                const offset = index - currentCarouselIndex;
                let scale = 1, translateX = 0, zIndex = 5 - Math.abs(offset), brightness = 1, opacity = 1;

                if (offset === 0) { scale = 1.1; translateX = 0; brightness = 1; } 
                else if (offset === -1) { scale = 0.85; translateX = -300; brightness = 0.6; } 
                else if (offset === 1) { scale = 0.85; translateX = 300; brightness = 0.6; } 
                else if (offset === -2) { scale = 0.65; translateX = -520; brightness = 0.3; } 
                else if (offset === 2) { scale = 0.65; translateX = 520; brightness = 0.3; } 
                else { scale = 0.5; opacity = 0; translateX = offset < 0 ? -600 : 600; }

                card.style.transform = `translate(-50%, -50%) translateX(${translateX}px) scale(${scale})`;
                card.style.zIndex = zIndex; card.style.filter = `brightness(${brightness})`; card.style.opacity = opacity;
            });
            selectedWorldIndex = currentCarouselIndex; 

            const leftArrow = document.querySelector('.left-arrow');
            const rightArrow = document.querySelector('.right-arrow');
            if (currentCarouselIndex === 0) { leftArrow.classList.add('deactive'); } else { leftArrow.classList.remove('deactive'); }
            if (currentCarouselIndex === projectWorlds.length - 1) { rightArrow.classList.add('deactive'); } else { rightArrow.classList.remove('deactive'); }
        }

        function selectCarouselItem(index) {
            if (index === currentCarouselIndex) return;
            currentCarouselIndex = index; playUiSound('hover'); updateCarousel();
        }
        function nextCarouselItem() { if (currentCarouselIndex < projectWorlds.length - 1) { playUiSound('click'); currentCarouselIndex++; updateCarousel(); } }
        function prevCarouselItem() { if (currentCarouselIndex > 0) { playUiSound('click'); currentCarouselIndex--; updateCarousel(); } }

        /* ---------------- ЛОГИКА ВЫБОРА ПРОЕКТА ИЗ КАРУСЕЛИ ---------------- */
        function playSelectedWorld() {
            const world = projectWorlds[selectedWorldIndex];
            if (!world) return;

            if (world.id === 'blocks') { openBlocksGUI(); } 
            else if (world.id === 'sprites') { openSpritesGUI(); }
            else if (world.id === 'models') { openProjectsGridGUI('models'); }
            else if (world.id === 'concepts') { openProjectsGridGUI('concepts'); }
            else { alert(`Раздел "${world.name}" в разработке...`); }
        }

        /* ---------------- БЛОКИ И СПРАЙТЫ ---------------- */
        async function openBlocksGUI() {
            document.getElementById('world-select-gui').classList.add('hidden');
            document.getElementById('blocks-gui').classList.remove('hidden');
            const gridContainer = document.getElementById('blocks-grid'); gridContainer.innerHTML = '';
            try {
                const response = await fetch('blocks.json'); const data = await response.json();
                let rawList = Array.isArray(data) ? data : (data.blocks || []);
                let imagePaths = rawList.map(item => typeof item === 'string' ? item : (item.src || item.path || item.img));
                renderSimpleGrid(gridContainer, [...new Set(imagePaths)].filter(Boolean));
            } catch (err) { console.warn('Demo blocks'); renderSimpleGrid(gridContainer, ['ui/blocks/dirt.png', 'ui/blocks/stone.png']); }
        }

        async function openSpritesGUI() {
            document.getElementById('world-select-gui').classList.add('hidden');
            document.getElementById('sprites-gui').classList.remove('hidden');
            const gridContainer = document.getElementById('sprites-grid'); gridContainer.innerHTML = '';
            try {
                const response = await fetch('sprites.json'); const data = await response.json();
                let rawList = Array.isArray(data) ? data : (data.sprites || []);
                let imagePaths = rawList.map(item => typeof item === 'string' ? item : (item.src || item.path || item.img));
                renderSimpleGrid(gridContainer, [...new Set(imagePaths)].filter(Boolean));
            } catch (err) { console.warn('Demo sprites'); renderSimpleGrid(gridContainer, ['ui/sprites/sword.png', 'ui/sprites/pickaxe.png']); }
        }

        function renderSimpleGrid(container, images) {
            images.forEach((imgSrc, index) => {
                const slot = document.createElement('div'); slot.className = 'block-item-slot';
                const img = document.createElement('img'); img.src = imgSrc;
                img.style.animationDelay = `${Math.min(index * 0.02, 0.5)}s`;
                slot.appendChild(img); container.appendChild(slot);
            });
        }

        /* ---------------- СЕТКА ПРОЕКТОВ (МОДЕЛИ / КОНЦЕПТЫ) ---------------- */
        let currentProjectsType = 'models';
        let currentProjectsData = [];

        async function openProjectsGridGUI(type) {
            currentProjectsType = type;
            document.getElementById('world-select-gui').classList.add('hidden');
            document.getElementById('projects-list-gui').classList.remove('hidden');
            
            const titleImg = document.getElementById('projects-list-title');
            titleImg.src = type === 'models' ? 'ui/models_title.png' : 'ui/concepts_title.png';
            
            const gridContainer = document.getElementById('projects-grid');
            gridContainer.innerHTML = '';
            currentProjectsData = [];

            try {
                const response = await fetch(`${type}.json`);
                const data = await response.json();
                currentProjectsData = data.projects || [];
                renderProjectsGrid(currentProjectsData);
            } catch (err) {
                console.warn(`Не удалось загрузить ${type}.json. Запуск демо-режима:`, err);
                currentProjectsData = [{
                    id: "demo", title: "Демо Проект", description: "Создайте JSON файл, чтобы увидеть свои проекты.",
                    thumbnail: "ui/demo_thumb.png", images: ["ui/demo1.png"]
                }];
                renderProjectsGrid(currentProjectsData);
            }
        }

        function renderProjectsGrid(projects) {
            const gridContainer = document.getElementById('projects-grid');
            projects.forEach((proj, index) => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.style.animationDelay = `${Math.min(index * 0.05, 0.5)}s`;
                card.onclick = () => { playUiSound('click'); openProjectDetail(proj); };
                
                const frameImg = currentProjectsType === 'models' ? 'ui/project_frame_models.png' : 'ui/project_frame_concepts.png';
                
                card.innerHTML = `
                    <div class="project-image-wrapper">
                        <img src="${proj.thumbnail}" alt="${proj.title}" class="project-thumb-image">
                        <div class="project-thumb-frame" style="background-image: url('${frameImg}');"></div>
                    </div>
                    <h4>${proj.title}</h4>
                `;
                gridContainer.appendChild(card);
            });

            setTimeout(updateProjectsScrollEffect, 50);
        }

        /* ---------------- ЛОГИКА УМЕНЬШЕНИЯ КАРТОЧЕК ПРИ СКРОЛЛЕ ---------------- */
        function updateProjectsScrollEffect() {
            const grid = document.getElementById('projects-grid');
            if (!grid) return;
            const gridRect = grid.getBoundingClientRect();
            const cards = grid.querySelectorAll('.project-card');
            const threshold = 110; // Зона быстрого уменьшения возле верхней и нижней границы

            cards.forEach(card => {
                const cardRect = card.getBoundingClientRect();
                
                // Расстояние от низа карточки до верхнего края сетки
                const distFromTop = cardRect.bottom - gridRect.top;
                // Расстояние от верха карточки до нижнего края сетки
                const distFromBottom = gridRect.bottom - cardRect.top;

                let scale = 1;

                if (distFromTop < threshold) {
                    scale = distFromTop / threshold;
                } else if (distFromBottom < threshold) {
                    scale = distFromBottom / threshold;
                }

                scale = Math.max(0, Math.min(1, scale));
                card.style.setProperty('--scroll-scale', scale.toFixed(3));
            });
        }

        document.getElementById('projects-grid').addEventListener('scroll', updateProjectsScrollEffect);

        /* ---------------- ЛОГИКА ДЕТАЛЬНОГО ПРОСМОТРА ПРОЕКТА ---------------- */
        let currentProjectImages = [];
        let currentProjectImageIndex = 0;

        function openProjectDetail(projectData) {
            document.getElementById('projects-list-gui').classList.add('hidden');
            document.getElementById('project-detail-gui').classList.remove('hidden');

            document.getElementById('project-detail-header-title').innerText = projectData.title;
            document.getElementById('project-info-title').innerText = projectData.title;
            document.getElementById('project-info-desc').innerText = projectData.description || "Описания нет.";

            currentProjectImages = projectData.images || [projectData.thumbnail];
            currentProjectImageIndex = 0;

            renderProjectThumbnails();
            updateProjectMainImage();
        }

        function closeProjectDetail() {
            document.getElementById('project-detail-gui').classList.add('hidden');
            document.getElementById('projects-list-gui').classList.remove('hidden');
            setTimeout(updateProjectsScrollEffect, 50);
        }

        function renderProjectThumbnails() {
            const strip = document.getElementById('project-thumbnails-strip');
            strip.innerHTML = '';
            
            if (currentProjectImages.length <= 1) {
                strip.style.display = 'none';
                return;
            }
            
            strip.style.display = 'flex';
            currentProjectImages.forEach((imgSrc, index) => {
                const thumb = document.createElement('div');
                thumb.className = `project-thumb-slot ${index === currentProjectImageIndex ? 'active' : ''}`;
                thumb.onclick = () => { playUiSound('hover'); setProjectImageIndex(index); };
                thumb.innerHTML = `<img src="${imgSrc}">`;
                strip.appendChild(thumb);
            });
        }

        function updateProjectMainImage() {
            const mainImg = document.getElementById('project-main-image');
            mainImg.style.opacity = 0;
            setTimeout(() => {
                mainImg.src = currentProjectImages[currentProjectImageIndex];
                mainImg.style.opacity = 1;
            }, 100);

            const thumbs = document.querySelectorAll('.project-thumb-slot');
            thumbs.forEach((el, idx) => {
                if (idx === currentProjectImageIndex) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function changeProjectImage(direction) {
            if (currentProjectImages.length <= 1) return;
            playUiSound('hover');
            currentProjectImageIndex += direction;
            if (currentProjectImageIndex < 0) currentProjectImageIndex = currentProjectImages.length - 1;
            if (currentProjectImageIndex >= currentProjectImages.length) currentProjectImageIndex = 0;
            updateProjectMainImage();
        }

        function setProjectImageIndex(index) {
            if (index === currentProjectImageIndex) return;
            currentProjectImageIndex = index;
            updateProjectMainImage();
        }

        /* ---------------- ЛОГИКА ТУЛТИПОВ ---------------- */
        const tooltipElem = document.getElementById('about-tooltip');
        const tooltipImg = document.getElementById('about-tooltip-img');
        const slotTooltips = { 'about-slot-1': 'ui/desc_slot_1.png', 'about-slot-2': 'ui/desc_slot_2.png', 'about-slot-3': 'ui/desc_slot_3.png', 'about-slot-4': 'ui/desc_slot_4.png', 'about-slot-5': 'ui/desc_slot_5.png' };

        document.addEventListener('mousemove', (e) => {
            if (tooltipElem.style.display === 'block') {
                let x = e.clientX + 10; let y = e.clientY - 20;
                if (x + tooltipElem.offsetWidth > window.innerWidth) { x = e.clientX - tooltipElem.offsetWidth - 5; }
                if (y + tooltipElem.offsetHeight > window.innerHeight) { y = e.clientY - tooltipElem.offsetHeight - 5; }
                tooltipElem.style.left = x + 'px'; tooltipElem.style.top = y + 'px';
            }
        });

        Object.keys(slotTooltips).forEach((slotId) => {
            const slotElem = document.getElementById(slotId);
            if (slotElem) {
                slotElem.addEventListener('mouseenter', () => { tooltipImg.src = slotTooltips[slotId]; tooltipElem.style.display = 'block'; });
                slotElem.addEventListener('mouseleave', () => { hideTooltip(); });
            }
        });
        function hideTooltip() { tooltipElem.style.display = 'none'; tooltipImg.src = ''; }

        /* ---------------- THREE.JS SKYBOX ---------------- */
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('skybox-container').appendChild(renderer.domElement);

        const textureLoader = new THREE.TextureLoader();
        function loadSkyTexture(path) {
            const tex = textureLoader.load(path);
            tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        const skyMaterials = [
            new THREE.MeshBasicMaterial({ map: loadSkyTexture('ui/skybox_side_4.png'), side: THREE.BackSide }),
            new THREE.MeshBasicMaterial({ map: loadSkyTexture('ui/skybox_side_2.png'), side: THREE.BackSide }),
            new THREE.MeshBasicMaterial({ map: loadSkyTexture('ui/skybox_top.png'), side: THREE.BackSide }),
            new THREE.MeshBasicMaterial({ map: loadSkyTexture('ui/skybox_bottom.png'), side: THREE.BackSide }),
            new THREE.MeshBasicMaterial({ map: loadSkyTexture('ui/skybox_side_3.png'), side: THREE.BackSide }),
            new THREE.MeshBasicMaterial({ map: loadSkyTexture('ui/skybox_side_1.png'), side: THREE.BackSide })
        ];
        
        scene.add(new THREE.Mesh(new THREE.BoxGeometry(900, 900, 900), skyMaterials));

        let lon = 0, lat = 0, phi = 0, theta = 0;
        function animate() {
            requestAnimationFrame(animate);
            lon += 0.05; lat = Math.max(-85, Math.min(85, lat));
            phi = THREE.MathUtils.degToRad(90 - lat); theta = THREE.MathUtils.degToRad(lon);
            camera.position.set(100 * Math.sin(phi) * Math.cos(theta), 100 * Math.cos(phi), 100 * Math.sin(phi) * Math.sin(theta));
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
